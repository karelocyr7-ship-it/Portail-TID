version: 2
mode: local_pull_agents_pending_installation
production_deployment_requires_human_approval: true
queue_policy:
  portal_task_creates: QUEUED
  execution_owner: application_local_agent
  max_concurrent_tasks_per_agent: 1
  destructive_actions: forbidden_by_default
  secrets_available_to_agents: false
  docker_socket_available_to_agents: false

agents:
  - id: portal-orchestrator
    type: orchestrator
    scope: [portal, orchestration]
    can_execute_production: false
  - id: portal-agent
    type: application
    application: portal
    scope: [portal]
    production_operations: [STATUS_APP, RESTART_APP]
    can_execute_production: false
  - id: monitoring-agent
    type: application
    application: monitoring
    scope: [monitoring]
    production_operations: [STATUS_APP, RESTART_APP]
    can_execute_production: false
  - id: glpi-agent
    type: application
    application: glpi
    scope: [glpi]
    can_execute_production: false
  - id: tdb-agent
    type: application
    application: tdb
    scope: [tdb]
    production_operations: [STATUS_APP, RESTART_APP]
    can_execute_production: false
  - id: cash-recon-agent
    type: application
    application: cash-recon
    scope: [cash-recon]
    production_operations: [STATUS_APP, RESTART_APP]
    can_execute_production: false
  - id: atf-agent
    type: application
    application: atf
    scope: [atf]
    can_execute_production: false
  - id: revue-pdv-agent
    type: application
    application: revue-pdv
    scope: [revue-pdv]
    production_operations: [STATUS_APP, RESTART_APP]
    can_execute_production: false
  - id: gparc-agent
    type: application
    application: gparc
    scope: [gparc]
    can_execute_production: false
  - id: mdm-agent
    type: application
    application: mdm
    scope: [mdm]
    can_execute_production: false
  - id: recrutement-om-telco-agent
    type: application
    application: recrutement-om-telco
    scope: [recrutement-om-telco]
    can_execute_production: false
  - id: sirh-agent
    type: application
    application: sirh
    scope: [sirh]
    can_execute_production: false
  - id: architecture-review-agent
    type: reviewer
    scope:
      [
        portal,
        tdb,
        cash-recon,
        atf,
        revue-pdv,
        gparc,
        mdm,
        recrutement-om-telco,
      ]
    can_execute_production: false
  - id: security-review-agent
    type: reviewer
    scope: [security, all_applications]
    can_execute_production: false
  - id: database-review-agent
    type: reviewer
    scope: [databases, all_applications]
    can_execute_production: false
  - id: test-quality-agent
    type: reviewer
    scope: [tests, all_applications]
    can_execute_production: false
  - id: deployment-agent
    type: operator
    scope: [deployment, all_applications]
    can_execute_production: false
  - id: documentation-agent
    type: operator
    scope: [documentation, all_applications]
    can_execute_production: false
