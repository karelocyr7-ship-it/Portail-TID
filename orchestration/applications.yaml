applications:
  - id: tdb
    name: TDB
    description: Tableau de bord transverse et consolidation des KPI
    vm_alias: Revue-PDV
    ssh_user: debian
    environment: production
    repository_path: /home/debian/TDB-TID
    git_remote: git@github.com:karelocyr7-ship-it/TDB.git
    default_branch: main
    integration_branch: codex/modernize-dashboard-kpi
    deployment_method: Docker Compose
    compose_file: /home/debian/TDB-TID/docker-compose.yml
    healthcheck_url: https://tdb.tadgroupe.com/api/health
    agent_file: AGENTS.md
    documentation_path: docs
    owner_agent: tdb-agent
    criticality: high
    automatic_production_deployment: false
    evidence: VM audit 2026-07-28; Git status, remote and Compose metadata

